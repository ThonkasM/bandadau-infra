                        1
                      ]
                    }
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "scrape-target-down",
          "title": "ScrapeTargetDown",
          "condition": "C",
          "for": "2m",
          "noDataState": "OK",
          "execErrState": "OK",
          "isPaused": false,
          "labels": {
            "severity": "critical",
            "team": "bandada"
          },
          "annotations": {
            "summary": "Prometheus no puede scrapear {{ $labels.job }}",
            "description": "El broker o Traefik no responden a la recolección de métricas."
          },
          "data": [
            {
              "refId": "A",
              "relativeTimeRange": {
                "from": 600,
                "to": 0
              },
              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "up{job=~\"rabbitmq|rabbitmq-queues|traefik\"}",
