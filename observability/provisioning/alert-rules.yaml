              "datasourceUid": "prometheus",
              "model": {
                "refId": "A",
                "expr": "sum by (queue)(rabbitmq_detailed_queue_consumers{queue=~\"(events-service\\\\.saga-replies|wallet-service\\\\.commands|ticketing-service\\\\.commands|social-service\\\\.events|media-service\\\\.events|notification-service\\\\.events|insights-service\\\\.analytics|n8n\\\\.automation)\"})",
                "instant": true,
