# Middlewares compartidos. El dominio llega por la variable BASE_DOMAIN del contenedor de Traefik.
http:
  middlewares:
    # CORS para los orígenes de desarrollo del contrato fase 1 §3.4:
    # http://localhost:{3000,3001,4201,8081} y cualquier *.BASE_DOMAIN.
    cors:
      headers:
        accessControlAllowOriginListRegex:
          - '^http://localhost:(3000|3001|4201|8081)$'
          - '^http://127\.0\.0\.1:(3000|3001|4201|8081)$'
          - '^https?://([a-z0-9-]+\.)?{{ env "BASE_DOMAIN" | replace "." "\\." }}$'
        accessControlAllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        accessControlAllowHeaders:
          - Authorization
          - Content-Type
          - Idempotency-Key
          - X-Correlation-Id
          - traceparent
          - tracestate
          - Accept-Language
          - X-Bandada-Client
        accessControlAllowCredentials: true
        accessControlExposeHeaders:
          - Idempotent-Replayed
          - Content-Language
          - X-Correlation-Id
          - Location
          - Retry-After
          - X-Unread-Count
        accessControlMaxAge: 600
        addVaryHeader: true

    # Límites razonables para desarrollo (la regla de prod, 10/min/IP en /auth, es más estricta: ver infraestructura.md).
    ratelimit-default:
      rateLimit:
        average: 100
        period: 1s
        burst: 200
    ratelimit-auth:
      rateLimit:
        average: 60
        period: 1m
        burst: 40

    secure-headers:
      headers:
        contentTypeNosniff: true
        customResponseHeaders:
          X-Frame-Options: DENY
          Referrer-Policy: strict-origin-when-cross-origin

    compress:
      compress: {}

    # Responde 403 a todo: nadie cumple el rango de origen. Para /internal/** y /api/v1/auth/service-token.
    deny-all:
      ipAllowList:
        sourceRange:
          - 255.255.255.255/32

    # R-8: CORS del endpoint MCP (clientes web como el MCP Inspector): mismas reglas que `cors` más las cabeceras del protocolo.
    cors-mcp:
      headers:
        accessControlAllowOriginListRegex:
          - '^http://localhost:(3000|3001|4201|8081|6274)$'
          - '^http://127\.0\.0\.1:(3000|3001|4201|8081|6274)$'
          - '^https?://([a-z0-9-]+\.)?{{ env "BASE_DOMAIN" | replace "." "\\." }}$'
        accessControlAllowMethods: [POST, OPTIONS]
        accessControlAllowHeaders:
          - Authorization
          - Content-Type
          - Accept
          - MCP-Protocol-Version
          - Mcp-Session-Id
          - X-Correlation-Id
          - traceparent
          - tracestate
        accessControlExposeHeaders:
          - Mcp-Session-Id
          - X-Correlation-Id
          - Retry-After
        accessControlMaxAge: 600
        addVaryHeader: true
    ratelimit-mcp:
      rateLimit:
        average: 20
        period: 1s
        burst: 40

    api-chain:
      chain:
        middlewares: [cors, ratelimit-default, secure-headers, compress]
    api-auth-chain:
      chain:
        middlewares: [cors, ratelimit-auth, secure-headers, compress]
    mcp-chain:
      chain:
        middlewares: [cors-mcp, ratelimit-mcp, secure-headers]
