# Configuración estática de Traefik v3 (local). El dominio sale de BASE_DOMAIN (env del contenedor).
global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
  traefik:
    address: ":8080"

api:
  dashboard: true
  insecure: true   # dashboard en :8080, solo local (en prod está deshabilitado)

ping:
  entryPoint: traefik

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Métricas RED por servicio para Grafana (observability/prometheus.yaml las scrapea en traefik:8080/metrics)
metrics:
  prometheus:
    entryPoint: traefik
    addEntryPointsLabels: true
    addServicesLabels: true
    buckets: [0.05, 0.1, 0.25, 0.5, 1, 2.5, 5, 10]

log:
  level: INFO

accessLog:
  format: json
  filters:
    statusCodes: ["400-599"]   # solo errores; el resto sería ruido en local
